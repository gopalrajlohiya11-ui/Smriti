<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#C85A32" />
      <stop offset="100%" stop-color="#8F3112" />
    </radialGradient>
    <radialGradient id="petalGrad" cx="0" cy="-15" r="25" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFA4B8" />
      <stop offset="40%" stop-color="#FF597B" />
      <stop offset="100%" stop-color="#E01E4B" />
    </radialGradient>
    <radialGradient id="centerStar" cx="0" cy="0" r="10" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="70%" stop-color="#FFD6E0" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FF597B" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10.24" stdDeviation="12.8" flood-color="#3D0C02" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- App Rounded Background Tile -->
  <rect width="512" height="512" rx="112.64" fill="url(#bgGrad)"/>

  <!-- Inner Soft Warm Cream Circle -->
  <circle cx="256" cy="256" r="199.68" fill="#FFF8F5" filter="url(#shadow)"/>

  <!-- Cherry Blossom Flower Group -->
  <g transform="translate(256, 256) scale(5.376)">
    <!-- 5 Heart-Notched Sakura Petals -->
    <!-- Petal 1 (Top) -->
    <path d="M0,0 C-7,-10 -15,-20 -7,-27 C-3,-30 0,-26 0,-26 C0,-26 3,-30 7,-27 C15,-20 7,-10 0,0 Z" fill="#FF597B" />
    <path d="M0,0 C-7,-10 -15,-20 -7,-27 C-3,-30 0,-26 0,-26 C0,-26 3,-30 7,-27 C15,-20 7,-10 0,0 Z" fill="url(#petalGrad)" />

    <!-- Petal 2 (Top-Right) -->
    <g transform="rotate(72)">
      <path d="M0,0 C-7,-10 -15,-20 -7,-27 C-3,-30 0,-26 0,-26 C0,-26 3,-30 7,-27 C15,-20 7,-10 0,0 Z" fill="#FF597B" />
      <path d="M0,0 C-7,-10 -15,-20 -7,-27 C-3,-30 0,-26 0,-26 C0,-26 3,-30 7,-27 C15,-20 7,-10 0,0 Z" fill="url(#petalGrad)" />
    </g>

    <!-- Petal 3 (Bottom-Right) -->
    <g transform="rotate(144)">
      <path d="M0,0 C-7,-10 -15,-20 -7,-27 C-3,-30 0,-26 0,-26 C0,-26 3,-30 7,-27 C15,-20 7,-10 0,0 Z" fill="#FF597B" />
      <path d="M0,0 C-7,-10 -15,-20 -7,-27 C-3,-30 0,-26 0,-26 C0,-26 3,-30 7,-27 C15,-20 7,-10 0,0 Z" fill="url(#petalGrad)" />
    </g>

    <!-- Petal 4 (Bottom-Left) -->
    <g transform="rotate(216)">
      <path d="M0,0 C-7,-10 -15,-20 -7,-27 C-3,-30 0,-26 0,-26 C0,-26 3,-30 7,-27 C15,-20 7,-10 0,0 Z" fill="#FF597B" />
      <path d="M0,0 C-7,-10 -15,-20 -7,-27 C-3,-30 0,-26 0,-26 C0,-26 3,-30 7,-27 C15,-20 7,-10 0,0 Z" fill="url(#petalGrad)" />
    </g>

    <!-- Petal 5 (Top-Left) -->
    <g transform="rotate(288)">
      <path d="M0,0 C-7,-10 -15,-20 -7,-27 C-3,-30 0,-26 0,-26 C0,-26 3,-30 7,-27 C15,-20 7,-10 0,0 Z" fill="#FF597B" />
      <path d="M0,0 C-7,-10 -15,-20 -7,-27 C-3,-30 0,-26 0,-26 C0,-26 3,-30 7,-27 C15,-20 7,-10 0,0 Z" fill="url(#petalGrad)" />
    </g>

    <!-- Center Soft Glow -->
    <circle cx="0" cy="0" r="10" fill="url(#centerStar)" />

    <!-- 5 Floral Stamens with Core Dots -->
    <g stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round">
      <line x1="0" y1="0" x2="0" y2="-12" />
      <line x1="0" y1="0" x2="11.4" y2="-3.7" />
      <line x1="0" y1="0" x2="7.0" y2="9.7" />
      <line x1="0" y1="0" x2="-7.0" y2="9.7" />
      <line x1="0" y1="0" x2="-11.4" y2="-3.7" />
    </g>
    <!-- Stamen Pollen Tips -->
    <circle cx="0" cy="-13" r="2.4" fill="#FFFFFF" />
    <circle cx="12.4" cy="-4" r="2.4" fill="#FFFFFF" />
    <circle cx="7.6" cy="10.5" r="2.4" fill="#FFFFFF" />
    <circle cx="-7.6" cy="10.5" r="2.4" fill="#FFFFFF" />
    <circle cx="-12.4" cy="-4" r="2.4" fill="#FFFFFF" />

    <!-- Center Pistil Core -->
    <circle cx="0" cy="0" r="4.2" fill="#E01E4B" />
    <circle cx="0" cy="0" r="2.2" fill="#FFFFFF" />
  </g>
</svg>